<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a">
<title>三电迁改 · 施工管理办公台</title>
<style>
:root{
  --bg:#eef2f7; --panel:#ffffff; --ink:#16202c; --ink2:#4a5a6c; --ink3:#7d8b9c;
  --line:#dbe3ee; --line2:#eef2f7;
  --brand:#0b4f8a; --brand2:#1a73c7; --brandsoft:#e8f1fb;
  --ok:#12694a; --oksoft:#e6f5ee; --warn:#9a5b00; --warnsoft:#fff4e0; --bad:#a52a2a;
  --r:12px; --shadow:0 1px 2px rgba(16,32,48,.06),0 6px 18px rgba(16,32,48,.06);
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  font-size:var(--fs); line-height:1.65; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--brand2);text-decoration:none}
.hidden{display:none!important}
.app{display:flex;min-height:100vh;align-items:stretch}

/* ---------- 侧栏 ---------- */
.side{
  width:232px;flex:0 0 232px;background:#0a2f52;color:#dbe7f3;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:17px;letter-spacing:.5px;color:#fff}
.brand span{display:block;font-size:12px;color:#8fb3d4;margin-top:3px;letter-spacing:.5px}
nav{padding:10px 8px;overflow-y:auto;flex:1}
nav a{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
  color:#c8d9ea;font-size:15px;line-height:1.3;margin-bottom:2px;cursor:pointer;
}
nav a .ic{width:22px;text-align:center;font-size:16px;flex:0 0 22px}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a.on{background:#1a73c7;color:#fff;font-weight:600}
nav .grp{font-size:11px;color:#7ea3c6;letter-spacing:2px;padding:14px 12px 6px}
.sidefoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#8fb3d4;line-height:1.6}
.sidefoot b{color:#cfe3f5}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(238,242,247,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;
}
.topbar .ttl{font-size:19px;font-weight:700;letter-spacing:.3px}
.topbar .proj{margin-left:auto;font-size:13px;color:var(--ink2);text-align:right;max-width:46vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{padding:20px 22px 60px;max-width:1060px;width:100%}

/* ---------- 通用组件 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#b9c7d8;background:#f7fafd}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0d5c9e}
.btn.soft{background:var(--brandsoft);border-color:#c9ddf2;color:var(--brand)}
.btn.danger{color:var(--bad);border-color:#eecfcf;background:#fdf3f3}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;font-weight:500;border-radius:8px}
.btn.lg{min-height:56px;font-size:17px;border-radius:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.3px}
.field .hint{font-size:12px;color:var(--ink3);font-weight:400;margin-left:6px}
input:not([type=checkbox]):not([type=radio]),select,textarea{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;line-height:1.5;outline:none;transition:.15s;
}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(26,115,199,.12)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7d8b9c 50%),linear-gradient(135deg,#7d8b9c 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.selwith{display:flex;gap:8px;align-items:flex-start}
.selwith textarea{flex:1}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid .fw{grid-column:1/-1}
@media(max-width:700px){.f2{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}}

/* 表格输入 */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tin{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.tin th{background:#f4f8fc;border:1px solid var(--line);padding:7px 8px;font-weight:600;font-size:13px;color:var(--ink2);text-align:left;white-space:nowrap}
table.tin td{border:1px solid var(--line);padding:3px}
table.tin td input{border:none;border-radius:0;padding:8px 6px;background:transparent;min-width:70px}
table.tin td input:focus{box-shadow:inset 0 0 0 2px var(--brand2);background:#fff}

/* 列表 */
.list{display:flex;flex-direction:column;gap:10px}
.item{
  display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;cursor:pointer;transition:.15s;
}
.item:hover{border-color:#b9c7d8;box-shadow:var(--shadow)}
.item .it-main{flex:1;min-width:0}
.item .it-t{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .it-s{font-size:12.5px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .it-d{font-size:12px;color:var(--ink2);background:var(--line2);border-radius:6px;padding:3px 8px;white-space:nowrap}
.empty{text-align:center;color:var(--ink3);padding:36px 10px;font-size:14px}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}

/* 首页 */
.hero{background:linear-gradient(135deg,#0b4f8a,#1a73c7);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:16px;box-shadow:0 8px 24px rgba(11,79,138,.22)}
.hero h2{margin:0 0 6px;font-size:22px;letter-spacing:.5px}
.hero p{margin:0;color:#d7e7f7;font-size:14px}
.hero .meta{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;font-size:13px;color:#cfe3f5}
.hero .meta b{color:#fff;font-size:16px;display:block;margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;
  transition:.15s;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);
}
.tile:hover{border-color:var(--brand2);transform:translateY(-2px)}
.tile .tic{font-size:22px;line-height:1}
.tile .tt{font-weight:700;font-size:15px}
.tile .td{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* 文档预览 */
.doc{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 34px;
  font-family:"SimSun","宋体",serif;font-size:15.5px;line-height:1.9;color:#111;
  max-height:64vh;overflow:auto;box-shadow:var(--shadow);
}
.doc h1{font-family:"SimHei","黑体",sans-serif;font-size:20px;text-align:center;margin:0 0 18px;letter-spacing:2px;font-weight:700}
.doc pre{font-family:inherit;white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.doc table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:13.5px}
.doc table th,.doc table td{border:1px solid #555;padding:6px 8px;text-align:left;vertical-align:top}
.doc table th{background:#f0f0f0;font-weight:700}

/* 提示 */
.note{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.7;margin-bottom:14px}
.note.info{background:var(--brandsoft);color:#12508a;border:1px solid #cee2f7}
.note.warn{background:var(--warnsoft);color:#7a4a00;border:1px solid #ffe0b3}
.note.ok{background:var(--oksoft);color:#0f5b40;border:1px solid #c8e9da}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--ink2);font-weight:600;vertical-align:middle}
.badge.b{background:var(--brandsoft);color:var(--brand)}
.badge.g{background:var(--oksoft);color:var(--ok)}
.badge.y{background:var(--warnsoft);color:var(--warn)}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(10,24,40,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modalbox{background:#fff;border-radius:14px;width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modalhead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);font-size:16px}
.modalhead button{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;color:var(--ink3);cursor:pointer;padding:0 4px}
.modalbody{padding:16px 18px;overflow:auto}
.pick{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;font-size:14px}
.pick:hover{border-color:var(--brand2);background:#f8fbff}
.pick .code{font-weight:700;color:var(--brand);white-space:nowrap}
.pick .nm{flex:1}
.pick .us{font-size:12px;color:var(--ink3)}

/* 提示条 */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#16202c;color:#fff;
  padding:11px 20px;border-radius:24px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;text-align:center}

/* 分组表单卡片 */
.fsec{border:1px solid var(--line);border-radius:12px;padding:14px 16px 2px;margin-bottom:14px;background:#fcfdff}
.fsec>.fsec-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.fsec>.fsec-h .no{width:24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.fsec>.fsec-h .nm{font-size:15px;font-weight:700;letter-spacing:.3px}
.fsec>.fsec-h .tag{font-size:11.5px;color:var(--ink3);font-weight:400}
.fsec .field:last-child{margin-bottom:12px}

/* 选项胶囊 */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 8px}
.chips .lb{font-size:12px;color:var(--ink3);align-self:center;margin-right:2px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;
  font-size:13.5px;line-height:1.4;cursor:pointer;transition:all .15s;user-select:none;color:var(--ink2);
}
.chip:hover{border-color:var(--brand2);color:var(--brand)}
.chip.on{background:var(--brandsoft);border-color:var(--brand2);color:var(--brand);font-weight:600;box-shadow:0 0 0 2px rgba(26,115,199,.08)}
.chip:active{transform:scale(.96)}
.chip.add{border-style:dashed;color:var(--ink3);background:transparent}
.chip.add:hover{color:var(--brand);border-color:var(--brand2)}
.chip.sm{font-size:12px;padding:4px 10px}
.chip.recent{background:#f6f8fb;border-style:dashed}

/* 进度条 */
.bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#1a73c7,#0b4f8a);transition:width .5s ease}
.kpi{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.kpi>div{font-size:12.5px;color:var(--ink3)}
.kpi b{display:block;font-size:19px;color:var(--ink);line-height:1.4}

/* 动效 */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.view-enter>*{animation:fadeUp .34s cubic-bezier(.2,.7,.3,1) both}
.view-enter>*:nth-child(2){animation-delay:.05s}
.view-enter>*:nth-child(3){animation-delay:.1s}
.view-enter>*:nth-child(4){animation-delay:.14s}
.view-enter>*:nth-child(n+5){animation-delay:.17s}
.modalbox{animation:popIn .22s cubic-bezier(.2,.7,.3,1)}
.toast{animation:toastIn .22s ease}
.tile:hover .tic{transform:scale(1.08) rotate(-3deg)}
.tile .tic{transition:transform .2s ease}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* 打印 */
#printArea{display:none}
@media print{
  body{background:#fff}
  .side,.topbar,.wrap,.modal,.toast{display:none!important}
  #printArea{display:block!important;padding:0;font-family:"SimSun","宋体",serif;font-size:12pt;line-height:1.8;color:#000}
  #printArea h1{font-family:"SimHei","黑体";font-size:16pt;text-align:center;margin:0 0 12pt}
  #printArea pre{font-family:inherit;white-space:pre-wrap;margin:0 0 6pt}
  #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt;margin:6pt 0}
  #printArea th,#printArea td{border:1px solid #000;padding:4pt 6pt;text-align:left}
  @page{margin:22mm 18mm}
}

/* 移动端 */
.mobnav{display:none}
@media(max-width:860px){
  .side{display:none}
  .app{flex-direction:column}
  .topbar{padding:10px 14px}
  .topbar .ttl{font-size:17px}
  .topbar .proj{max-width:40vw;font-size:12px}
  .wrap{padding:14px 14px 90px}
  .doc{padding:18px 16px;font-size:15px;max-height:none}
  .card{padding:15px 15px;border-radius:11px}
  .mobnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(10px);
  }
  .mobnav a{flex:1;text-align:center;font-size:11px;color:var(--ink3);padding:4px 0;cursor:pointer}
  .mobnav a .ic{display:block;font-size:19px;line-height:1.35}
  .mobnav a.on{color:var(--brand);font-weight:700}
  .hero{padding:18px}
  .hero h2{font-size:19px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:13px}
  .btn{min-height:46px}
}
</style>

<meta name="description" content="三电迁改施工管理办公台：施工日志、安全技术交底、要点停电申请、隐蔽验收、周报月报、例会汇报、QC 与五小成果。离线可用，数据存本机。">
</head>
<body><div class="app">
  <aside class="side">
    <div class="brand">
      <b>三电迁改 · 办公台</b>
      <span>施工管理日常作业 v1.3 离线版</span>
    </div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      数据存在本机 · 同步码互传<br>
      <b id="footStat">—</b>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="ttl" id="viewTitle">今日工作</div>
      <div class="proj" id="projName">工程台账未填写</div>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>

<div class="mobnav" id="mobnav"></div>
<div class="modal hidden" id="modal">
  <div class="modalbox">
    <div class="modalhead"><b id="modalTitle"></b><button type="button" onclick="closeModal()">×</button></div>
    <div class="modalbody" id="modalBody"></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>
<div id="printArea"></div>
<script>/* ===================== 三电迁改·施工管理办公台 v1.0 =====================
   纯离线单文件应用：无服务器、无接口、无费用；数据存本机浏览器。       */
'use strict';

/* ---------- 小工具 ---------- */
var WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function today(){
  var d = new Date(), m = d.getMonth()+1, dd = d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function wdOf(s){
  if(!s) return '';
  var p = s.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d) ? '' : WEEK[d.getDay()];
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function arr(v){
  if(!v) return [];
  return String(v).split('\n').map(function(x){return x.replace(/^\s+|\s+$/g,'');}).filter(Boolean);
}
function num(list, start){
  var n = start||1;
  return list.map(function(x){ return (n++) + '. ' + x; }).join('\n');
}
function kv(label, v){
  v = (v==null?'':String(v)).replace(/^\s+|\s+$/g,'');
  return v ? (label + '：' + v) : '';
}
function joinLines(){
  var out = [];
  for(var i=0;i<arguments.length;i++){
    var a = arguments[i];
    if(a) out.push(a);
  }
  return out.filter(Boolean).join('\n');
}

/* ---------- 数据：技术标准库（可增删改） ---------- */
var STANDARDS0 = [
  {code:'TB 10420-2018', name:'铁路电力工程施工质量验收标准', use:'电力线路、变配电所迁改验收'},
  {code:'TB 10418-2018', name:'铁路通信工程施工质量验收标准', use:'通信光缆、设备迁改验收'},
  {code:'TB 10419-2018', name:'铁路信号工程施工质量验收标准', use:'信号电缆、设备迁改验收'},
  {code:'铁运〔2012〕280号', name:'铁路营业线施工安全管理办法', use:'要点登记、驻站联络、现场防护'},
  {code:'建设部令第37号', name:'危险性较大的分部分项工程安全管理规定', use:'深基坑、起重吊装等专项方案'},
  {code:'国务院令第393号', name:'建设工程安全生产管理条例', use:'安全生产责任制、交底与验收'},
  {code:'GB 50233-2014', name:'110kV～750kV架空输电线路施工及验收规范', use:'架空线路迁改、杆塔基础、架线'},

var CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五'];
function cnYmd(s){
  if(!s) return '';
  var p = s.split('-');
  return (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日';
}
function sec(n, t, body){
  body = (body==null?'':String(body)).replace(/\s+$/,'');
  if(!body) return '';
  return '【' + CN[n] + '、' + t + '】\n' + body;
}

/* ---------- 跨设备同步：同步码（不走服务器） ---------- */
function b64enc(bytes){
  var s = '', b = new Uint8Array(bytes);
  for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function b64dec(str){
  var bin = atob(str), out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function gzipStr(str){
  if(!('CompressionStream' in window)) return Promise.resolve(null);
  try{
    var cs = new CompressionStream('gzip');
    var w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(str));
    w.close();
    return new Response(cs.readable).arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
  }catch(e){ return Promise.resolve(null); }
}
function gunzipStr(bytes){
  var ds = new DecompressionStream('gzip');
  var w = ds.writable.getWriter();
  w.write(bytes);
  w.close();
  return new Response(ds.readable).text();
}
function makeSyncCode(){
  var json = JSON.stringify(syncPayload());
  return gzipStr(json).then(function(gz){
    if(gz) return 'SDXG1G:' + b64enc(gz);
    return 'SDXG1P:' + b64enc(new TextEncoder().encode(json));
  });
}
function applySyncCode(text){
  return new Promise(function(resolve, reject){
    try{
      var raw = String(text||'').trim();
      if(raw.charAt(0) === '{'){ resolve(JSON.parse(raw)); return; }
      var t = raw.replace(/\s+/g, '');
      if(t.indexOf('SDXG1G:') === 0){
        var bytes = b64dec(t.slice(7));
        if(!('DecompressionStream' in window)) throw new Error('这个浏览器不支持解压同步码，请改用导出文件');
        gunzipStr(bytes).then(function(json){ resolve(JSON.parse(json)); }, function(e){ reject(e); });
        return;
      }
      if(t.indexOf('SDXG1P:') === 0){ resolve(JSON.parse(new TextDecoder().decode(b64dec(t.slice(7))))); return; }
      reject(new Error('格式不对，同步码应以 SDXG1G: 开头'));
    }catch(e){ reject(e); }
  });
}
function mergeIncoming(inc){
  var stat = {added:0, updated:0};
  MODULES.forEach(function(m){
    var cur = DB.records[m.id] || [], map = {};
    cur.forEach(function(r){ map[r.id] = r; });
    ((inc.records || {})[m.id] || []).forEach(function(r){
      if(!r || !r.id) return;
      var ex = map[r.id];
      if(!ex){ map[r.id] = r; stat.added++; }
      else if((r.updated||0) > (ex.updated||0)){ map[r.id] = r; stat.updated++; }
    });
    DB.records[m.id] = Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a,b){ return (b.updated||0) - (a.updated||0); });
  });
  var p = DB.project || {}, ip = inc.project || {};
  Object.keys(ip).forEach(function(k){
    if(Array.isArray(ip[k])){ if(!p[k] || !p[k].length) p[k] = ip[k]; }
    else if(!String(p[k]||'').trim()) p[k] = ip[k];
  });
  DB.project = p;
  (inc.standards || []).forEach(function(s){
    var has = DB.standards.filter(function(x){ return x.code === s.code; }).length;
    if(!has) DB.standards.push(s);
  });
  if(inc.memory && inc.memory.chips){
    Object.keys(inc.memory.chips).forEach(function(k){
      var arr = DB.memory.chips[k] || [];
      inc.memory.chips[k].forEach(function(v){ if(arr.indexOf(v) < 0) arr.push(v); });
      DB.memory.chips[k] = arr;
    });
  }
  saveDB();
  return stat;
}
function replaceWith(inc){
  DB.project = inc.project || {};
  DB.records = inc.records || {};
  DB.settings = inc.settings || DB.settings || {};
  if(inc.standards && inc.standards.length) DB.standards = inc.standards;
  if(inc.memory) DB.memory = inc.memory;
  MODULES.forEach(function(m){ if(!DB.records[m.id]) DB.records[m.id] = []; });
  saveDB();
}

function render(){

  document.getElementById('projName').textContent = p.gc_name || '工程台账未填写（点“工程台账”完善）';
  var titles = {home:'今日工作', project:'工程台账', standards:'技术标准库', prompts:'提示词库',
                backup:'同步与备份', sync:'云同步', help:'使用说明', more:'全部功能'};
  var m = modOf(ST.view === 'editor' ? ST.mod : ST.mod);
  document.getElementById('viewTitle').textContent =
    ST.view === 'module' ? (m ? m.name : '') :
    ST.view === 'editor' ? (m ? m.name + ' · 编辑' : '') :
    (titles[ST.view] || '工作台');
  navHtml();
  var html = '';
  if(ST.view==='home') html = vHome();
  else if(ST.view==='project') html = vProject();
  else if(ST.view==='module') html = vList(m);
  else if(ST.view==='editor') html = vEditor(m);
  else if(ST.view==='standards') html = vStandards();
  else if(ST.view==='prompts') html = vPrompts();
  else if(ST.view==='backup') html = vBackup();
  else if(ST.view==='sync') html = vSync();
  else if(ST.view==='help') html = vHelp();
  else if(ST.view==='more') html = vMore();
  var w = document.getElementById('view');
  w.innerHTML = html;
  if(!storeOK()) {
    w.innerHTML = '<div class="note warn">⚠️ 当前浏览器不允许本页面保存数据（可能是隐私模式或安全策略）。请改用 Chrome / Edge 打开，或到“数据备份”随时导出文件。</div>' + w.innerHTML;
  }
  if(ST.lastView !== ST.view){
    w.classList.add('view-enter');
    var wv = w;
    setTimeout(function(){ wv.classList.remove('view-enter'); }, 600);
    ST.lastView = ST.view;
  }
  document.getElementById('footStat').textContent = statLine();
}

/* ---------- 工程台账 ---------- */
function vProject(){
  var p = DB.project||{};
  var total = 0, filled = 0;
  PROFILE_GROUPS.forEach(function(g){
    g.fields.forEach(function(fd){
      if(fd.t === 'table'){
        total++;
        if((p[fd.k]||[]).some(function(r){ return r && r.some(function(c){ return c && String(c).trim(); }); })) filled++;
      } else {
        total++;
        if(String(p[fd.k]||'').trim()) filled++;
      }
    });
  });
  var pct = Math.round(filled / total * 100);
  var html = '<div class="card"><h3>台账完成度</h3>' +
    '<div class="sub">填一次，之后所有文档自动取用；不确定的可以留空，不影响出文档</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="kpi"><div><b>' + pct + '%</b>已填写</div><div><b>' + filled + '/' + total + '</b>条目</div>' +
    '<div><b>' + (p.cq||[]).filter(function(r){return r&&r[0];}).length + '</b>产权单位</div>' +
    '<div><b>' + (p.ry||[]).filter(function(r){return r&&r[0];}).length + '</b>项目人员</div></div></div>';

  PROFILE_GROUPS.forEach(function(g, gi){
    var fields = g.fields.map(function(fd){
      if(fd.t === 'table'){
        return '<div class="field fw"><label>' + fd.l + '</label>' + tableProject(fd, p) + '</div>';
      }
      return projField(fd, p);
    }).join('');
    html += '<div class="fsec"><div class="fsec-h"><span class="no">' + (gi+1) + '</span>' +
      '<span class="nm">' + g.title + '</span>' + (g.sub?'<span class="tag">' + g.sub + '</span>':'') + '</div>' +
      '<div class="fgrid">' + fields + '</div></div>';
  });
  html += '<div class="btns" style="margin-top:4px"><button class="btn primary lg" onclick="saveProject()">保存台账</button>' +
    '<button class="btn" onclick="go(\'home\')">返回首页</button>' +
    '<button class="btn" onclick="addProfileRows()">补齐空白行</button></div>';
  return html;
}
function projField(fd, p){
  var v = p[fd.k] == null ? '' : p[fd.k];
  var id = 'p_' + fd.k;
  var wide = fd.t === 'area';
  if(fd.t === 'area'){
    return '<div class="field fw"><label>' + fd.l + '</label><textarea id="' + id + '" data-p="' + fd.k +
      '" oninput="updP(this)" placeholder="' + esc(fd.ph||'') + '">' + esc(v) + '</textarea></div>';
  }
  return '<div class="field"><label>' + fd.l + '</label><input type="' + (fd.t==='date'?'date':'text') + '" id="' + id +
    '" data-p="' + fd.k + '" oninput="updP(this)" value="' + esc(v) + '" placeholder="' + esc(fd.ph||'') + '"></div>';
}
function tableProject(fd, p){
  var rows = (p[fd.k] && p[fd.k].length) ? p[fd.k] : (fd.def || []);
  var head = '<tr>' + fd.cols.map(function(c){ return '<th>' + c + '</th>'; }).join('') + '<th style="width:44px"></th></tr>';
  var body = rows.map(function(r, ri){
    return '<tr>' + fd.cols.map(function(c, ci){
      return '<td><input data-pk="' + fd.k + '" data-r="' + ri + '" data-c="' + ci + '" value="' + esc(r[ci]||'') + '" oninput="updPT(this)"></td>';
    }).join('') + '<td style="text-align:center"><button class="btn sm danger" onclick="delPRow(\'' + fd.k + '\',' + ri + ')">×</button></td></tr>';
  }).join('');
  return '<div class="tblwrap"><table class="tin">' + head + body + '</table></div>' +
    '<div class="btns" style="margin-top:8px"><button class="btn sm" onclick="addPRow(\'' + fd.k + '\')">＋ 加一行</button></div>';
}
function updP(el){ DB.project[el.getAttribute('data-p')] = el.value; }
function updPT(el){
  var k = el.getAttribute('data-pk'), r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c');
  if(!DB.project[k]) DB.project[k] = [];
  while(DB.project[k].length <= r) DB.project[k].push([]);
  DB.project[k][r][c] = el.value;
}
function addPRow(k){
  if(!DB.project[k]) DB.project[k] = [[]];
  DB.project[k].push([]);
  render();
}
function delPRow(k, ri){
  if(DB.project[k]) DB.project[k].splice(ri,1);
  render();
}
function addProfileRows(){
  PROFILE_GROUPS.forEach(function(g){
    g.fields.forEach(function(fd){
      if(fd.t === 'table' && !(DB.project[fd.k]||[]).length && fd.def){
        DB.project[fd.k] = fd.def.map(function(r){ return r.slice(); });
      }
    });
  });
  render(); toast('已补齐通讯录空白行');
}
function saveProject(){ saveDB(); schedulePush(); toast('台账已保存，之后所有文档自动取用'); render(); }

/* ---------- 模块列表 ---------- */
function recTitle(m, d){
  d = d || {};
  if(m.id==='log') return [d.didian, d.zuoye].filter(Boolean).join(' · ') || '施工日志';
  if(m.id==='jd') return [d.didian, d.jdlx].filter(Boolean).join(' · ') || '安全技术交底';
  if(m.id==='yao') return d.dd || '要点申请';
  if(m.id==='yj') return [d.gbw, d.xm].filter(Boolean).join(' · ') || '隐蔽验收';
  if(m.id==='week') return [d.rq1, d.rq2].filter(Boolean).join(' 至 ') || '周（月）报';
  if(m.id==='hui') return [d.dx, d.qci].filter(Boolean).join(' · ') || '例会汇报';
  if(m.id==='qc') return d.kt || 'QC 成果';
  if(m.id==='wx') return d.mc || '五小成果';
  return m.name;
}
function vList(m){
  if(!m) return '<div class="note warn">模块不存在</div>';
  var rs = (DB.records[m.id]||[]).slice().sort(function(a,b){ return (b.updated||0)-(a.updated||0); });
  var list = rs.length ? '<div class="list">' + rs.map(function(r){
      return '<div class="item" onclick="openRec(\'' + m.id + '\',\'' + r.id + '\')">' +
        '<div class="it-main"><div class="it-t">' + esc(recTitle(m, r.data)) + '</div>' +
        '<div class="it-s">' + m.name + ' · 保存于 ' + timeStr(r.updated||r.created) + '</div></div>' +
        '<div class="it-d">' + (r.data.date || r.data.rq2 || '—') + '</div></div>';
    }).join('') + '</div>'
    : '<div class="empty"><b>还没有记录</b>点下面按钮新建一份</div>';
  return '<div class="card"><h3>' + m.icon + ' ' + m.name + '</h3><div class="sub">' + (m.desc||'') + '</div>' +
    '<div class="btns"><button class="btn primary lg" onclick="newRec(\'' + m.id + '\')">＋ 新建' + m.name + '</button></div></div>' +
    '<div class="card"><h3>历史记录（' + rs.length + '）</h3><div class="sub">点开可修改、复制、导出 Word</div>' + list + '</div>';
}
function newRec(id){
  var m = modOf(id);
  var d = {date: today()};
  if(id==='week'){
    d.rq2 = today();
    var t = new Date(); t.setDate(t.getDate()-6);
    d.rq1 = t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);
  }
  if(id==='qc' || id==='wx' || id==='hui') d.date = '';
  if(id==='log' || id==='jd') { d.didian=''; d.jdlx = (id==='jd' ? '电力线路迁改（停电作业）' : ''); }
  if(id==='log'){
    var last = (DB.records.log||[])[0];
    if(last && last.data){
      ['renyuan','jixie','cailiao','jdr','jsr','jlr','yiju'].forEach(function(k){
        if(last.data[k]) d[k] = last.data[k];
      });
    }
  }
  ST.draft = d; ST.recId = null; ST.view='editor'; ST.mod=id; ST.parts=null;
  var dk = readDraft(id);
  if(dk && dk.data && !dk.recId){
    ST.draft = dk.data;
    setTimeout(function(){ toast('已恢复 12 小时内未保存的草稿'); }, 300);
  }
  render(); window.scrollTo(0,0);
}
function openRec(modId, recId){
  var m = modOf(modId);
  var r = (DB.records[modId]||[]).filter(function(x){ return x.id===recId; })[0];
  if(!r) return;
  ST.view='editor'; ST.mod=modId; ST.recId=recId;
  ST.draft = JSON.parse(JSON.stringify(r.data)); ST.parts=null;
  render(); window.scrollTo(0,0);
}

/* ---------- 编辑器 ---------- */
function vEditor(m){
  if(!m) return '<div class="note warn">模块不存在</div>';
  var d = ST.draft || (ST.draft = {date: today()});
  var groups = m.groups || [];
  var html = '<div class="card"><h3>' + m.icon + ' ' + (ST.recId ? '编辑' : '新建') + m.name + '</h3>' +
    '<div class="sub">' + (m.desc||'') + '；灰底胶囊是常用项，点一下就填，空白项不会出现在文档里</div>' +
    '<div class="btns">' +
    (m.id==='log' ? '<button class="btn soft" onclick="reuseLog()">↩ 沿用上次日志</button>' : '') +
    '<button class="btn" onclick="closeAndList()">返回列表</button>' +
    '</div></div>';

  if(groups.length){
    var gi = -1;
    var open = false;
    var ordered = m.fields.map(function(f, i){ return {f:f, i:i}; })
      .sort(function(a,b){ return ((a.f.grp==null?0:a.f.grp) - (b.f.grp==null?0:b.f.grp)) || (a.i - b.i); })
      .map(function(x){ return x.f; });
    ordered.forEach(function(fd, idx){
      var g = (fd.grp == null ? 0 : fd.grp);
      if(g !== gi){
        if(open) html += '</div></div>';
        gi = g;
        open = true;
        var gt = groups[gi] || ['', ''];
        html += '<div class="fsec"><div class="fsec-h"><span class="no">' + (gi+1) + '</span>' +
                '<span class="nm">' + gt[0] + '</span>' + (gt[1]?'<span class="tag">' + gt[1] + '</span>':'') + '</div>' +
                '<div class="fgrid">';
      }
      html += fieldHtml(fd, d, m);
    });
    if(open) html += '</div></div>';
  } else {
    html += '<div class="fsec"><div class="fgrid">' + m.fields.map(function(fd){ return fieldHtml(fd, d, m); }).join('') + '</div></div>';
  }

  html += '<div class="card"><div class="btns" style="margin-top:0">' +
    '<button class="btn primary lg" onclick="generate()">生成文档预览</button>' +
    '<button class="btn" onclick="saveRec()">保存到记录</button>' +
    (ST.recId ? '<button class="btn danger" onclick="delRec()">删除这份</button>' : '') +
    '</div></div>';
  html += '<div id="docPanel">' + (ST.parts ? docPanelHtml(m) : '') + '</div>';
  return html;
}
function closeAndList(){ go('module', ST.mod); }
function reuseLog(){
  var last = (DB.records.log||[])[0];
  if(!last){ toast('还没有历史日志'); return; }
  ['renyuan','jixie','cailiao','jdr','jsr','jlr','yiju','tianqi','wendu','cuoshi'].forEach(function(k){
    if(last.data[k]) ST.draft[k] = last.data[k];

/* 字段渲染 */
function fieldHtml(fd, d, m){
  var v = d[fd.k];
  var id = 'f_' + fd.k;
  var label = '<label>' + fd.l + (fd.hint?'<span class="hint">'+fd.hint+'</span>':'') + '</label>';

  if(fd.t === 'table') return '<div class="field fw"><label>' + fd.l + '</label>' + tableField(fd, v, d, m) + '</div>';

  if(fd.t === 'sel'){
    var opts = fd.opts || [];
    if(opts.length <= 11) return '<div class="field fw">' + label + selChips(opts, v, fd.k) + '</div>';
    var o = '<option value="">— 请选择 —</option>' + opts.map(function(x){
      return '<option value="' + esc(x) + '"' + (x===v?' selected':'') + '>' + esc(x) + '</option>';
    }).join('');
    return '<div class="field"><label>' + fd.l + '</label><select id="' + id + '" data-k="' + fd.k + '" onchange="upd(this)">' + o + '</select></div>';
  }

  if(fd.t === 'area'){
    return '<div class="field fw">' + label + '<textarea id="' + id + '" data-k="' + fd.k + '"' +
      ' oninput="upd(this)" placeholder="' + esc(fd.ph||'') + '">' + (v==null?'':esc(v)) + '</textarea></div>';
  }

  if(fd.t === 'lines'){
    var bar = fd.chip ? chipBar(fd, v, m) : '';
    return '<div class="field fw">' + label + bar +
      '<div class="selwith"><textarea id="' + id + '" data-k="' + fd.k + '" oninput="upd(this)" placeholder="' +
      esc(fd.ph||'') + '">' + (v==null?'':esc(v)) + '</textarea>' + factBtn(fd.btn) + '</div></div>';
  }

  var rec = (!fd.t || fd.t === 'text') ? recentsBar(fd, v, m) : '';
  return '<div class="field"><label>' + fd.l + '</label>' +
    '<input type="' + (fd.t==='date'?'date':'text') + '" id="' + id + '" data-k="' + fd.k + '" oninput="upd(this)" value="' +
    (v==null?'':esc(v)) + '" placeholder="' + esc(fd.ph||'') + '">' + rec + '</div>';
}
function factBtn(kind){
  if(kind==='std') return '<button class="btn soft sm" onclick="pickStd()">标准库</button>';
  if(kind==='jdt') return '<button class="btn soft sm" onclick="fillJdt()">填标准措施</button>';
  if(kind==='logs') return '<button class="btn soft sm" onclick="fillLogs()">汇总日志</button>';
  return '';
}
function selChips(opts, v, k){
  return '<div class="chips">' + opts.map(function(o){
    return '<span class="chip' + (o===v?' on':'') + '" data-chipk="' + k + '" data-v="' + esc(o) +
      '" onclick="pickOne(this)">' + esc(o) + '</span>';
  }).join('') + '</div>';
}
function pickOne(el){
  var k = el.getAttribute('data-chipk'), v = el.getAttribute('data-v');
  ST.draft[k] = (ST.draft[k] === v) ? '' : v;

function generate(){

  if(!m) return;
  var r = m.build(ST.draft || {}, DB);

  rememberAll(m, ST.draft || {});

  var el = document.getElementById('docPanel');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function docPanelHtml(m){
  return '<div class="card"><h3>✅ 生成的文档' + (m?('（'+m.name+'）'):'') + '</h3>' +
    '<div class="sub">直接复制粘贴到 WPS，或导出 .doc 用 WPS 打开再排版</div>' +
    '<div class="doc" id="docBody">' + partsHtml(ST.title, ST.parts) + '</div>' +
    '<div class="btns"><button class="btn primary" onclick="copyRich()">📋 复制（带格式，粘进 WPS）</button>' +
    '<button class="btn" onclick="copyDoc()">复制纯文本</button>' +
    '<button class="btn" onclick="downloadDoc()">⬇ 导出 Word(.doc)</button>' +
    '<button class="btn" onclick="printDoc()">🖨 打印 / 存 PDF</button>' +
    '<button class="btn" onclick="saveRec()">💾 保存到记录</button></div>' +
    (/iPhone|iPad|iPod/.test(navigator.userAgent) ? '<div class="note info" style="margin-top:10px">📱 iPhone 上建议优先用「复制（带格式）」粘到 WPS App；导出 .doc 会存进“文件”App，用 WPS 打开即可。</div>' : '') +
    '</div>';
}
function cleanParts(parts){
  var kept = (parts||[]).filter(function(p){
    if(typeof p !== 'string') return true;
    return p.split('\n').some(function(l){
      var t = l.trim();
      return t && !/^【[^】]*】$/.test(t);
    });
  });
  var n = 0;
  return kept.map(function(p){
    if(typeof p !== 'string') return p;
    var lines = p.split('\n');
    for(var i=0;i<lines.length;i++){
      var t = lines[i].trim();
      if(!t) continue;
      var mm = t.match(/^【([^】]*)】$/);
      if(mm){
        n++;
        var inner = mm[1].replace(/^[一二三四五六七八九十]+、/, '');
        lines[i] = '【' + (CN[n-1] || n) + '、' + inner + '】';
      }
      break;
    }
    return lines.join('\n');
  });
}
function partsHtml(title, parts){
  var h = '<h1>' + esc(title||'') + '</h1>';
  cleanParts(parts).forEach(function(p){
    if(p==null) return;
    if(typeof p === 'string'){
      if(p.trim()) h += '<pre>' + esc(p) + '</pre>';
    } else if(p.t === 'table'){
      var rows = (p.rows||[]).filter(function(r){ return r && r.some(function(c){ return c && String(c).trim(); }); });
      if(!rows.length) return;
      h += '<table><tr>' + p.cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
           rows.map(function(r){ return '<tr>' + p.cols.map(function(c,i){ return '<td>' + esc(r[i]||'') + '</td>'; }).join('') + '</tr>'; }).join('') +
           '</table>';
    }
  });
  return h;
}
function partsText(parts){
  return cleanParts(parts).map(function(p){
    if(typeof p === 'string') return p;
    if(p && p.t==='table'){
      var rows = (p.rows||[]).filter(function(r){ return r && r.some(function(c){ return c && String(c).trim(); }); });
      if(!rows.length) return '';
      return rows.map(function(r){ return r.join(' ｜ '); }).join('\n');
    }
    return '';
  }).filter(Boolean).join('\n\n');
}
function clipHtml(){
  var out = '<div style="font-family:SimSun,\u5b8b\u4f53;font-size:12pt;line-height:1.8">';
  out += '<h2 style="text-align:center;font-family:SimHei,\u9ed1\u4f53;font-size:16pt;margin:0 0 10pt">' + esc(ST.title) + '</h2>';
  cleanParts(ST.parts).forEach(function(p){
    if(typeof p === 'string'){
      out += '<p style="margin:0 0 6pt">' + esc(p).replace(/\n/g,'<br>') + '</p>';
    } else if(p && p.t==='table'){
      var rows = (p.rows||[]).filter(function(r){ return r && r.some(function(c){ return c && String(c).trim(); }); });
      if(!rows.length) return;
      out += '<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%">' +
        '<tr>' + p.cols.map(function(c){ return '<th style="background:#f2f2f2">' + esc(c) + '</th>'; }).join('') + '</tr>' +
        rows.map(function(r){ return '<tr>' + p.cols.map(function(c,i){ return '<td>' + esc(r[i]||'') + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</table>';
    }
  });
  return out + '</div>';
}
function copyRich(){
  if(!ST.parts) return toast('请先生成文档');
  var plain = partsText(ST.parts);
  try{
    if(navigator.clipboard && window.ClipboardItem && window.isSecureContext !== false){
      var item = new ClipboardItem({
        'text/html': new Blob(['<meta charset="utf-8">' + clipHtml()], {type:'text/html'}),
        'text/plain': new Blob([plain], {type:'text/plain'})
      });
      navigator.clipboard.write([item]).then(function(){
        toast('已复制（带格式），到 WPS 里粘贴即可');
      }, function(){ fallbackCopy(plain); });
      return;
    }
  }catch(e){}
  fallbackCopy(plain);
}
function copyDoc(){
  var txt = partsText(ST.parts);
  if(!txt) return toast('还没有内容');
  copyPlain(txt, '已复制，去 WPS 粘贴即可');
}
function copyPlain(txt, msg){
  if(!txt) return toast('没有内容');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(String(txt)).then(function(){ toast(msg||'已复制'); }, function(){ fallbackCopy(txt, msg); });
  } else fallbackCopy(txt, msg);
}
function fallbackCopy(txt, msg){
  var ta = document.createElement('textarea');
  ta.value = String(txt); ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg||'已复制'); }
  catch(e){ toast('复制失败，请长按选择文字复制'); }
  document.body.removeChild(ta);
}
function safeName(s){ return String(s||'文档').replace(/[\\\/:*?"<>|]/g,'_').slice(0,60); }
function downloadDoc(){
  if(!ST.parts) return toast('请先生成文档');
  var body = partsHtml(ST.title, ST.parts);

    '<title>' + esc(ST.title) + '</title><style>body{font-family:"SimSun","宋体";font-size:12pt;line-height:1.8}h1{font-family:"SimHei","黑体";font-size:16pt;text-align:center;margin:0 0 12pt}pre{font-family:"SimSun","宋体";white-space:pre-wrap;margin:0 0 8pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4pt 6pt;text-align:left;font-size:10.5pt}</style></head><body>' + body + '</body></html>';
  var blob = new Blob(['\ufeff' + html], {type:'application/msword;charset=utf-8'});

  a.download = safeName(ST.title + '-' + (ST.draft.date || ST.draft.rq2 || today())) + '.doc';
  document.body.appendChild(a); a.click();

/* ---------- 云同步 ---------- */
var LAST_SHARE = '';
function syncCfg(){
  DB.sync = DB.sync || {url:'', token:'', auto:true, rev:0, ts:'', lastPush:'', lastPull:'', pending:null};
  return DB.sync;
}
function syncReady(){
  var s = syncCfg();
  return !!(String(s.url||'').trim() && String(s.token||'').trim());
}
function syncBase(){ return String(syncCfg().url||'').trim().replace(/\/+$/, ''); }
function syncPayload(){
  return {schema:DB.schema||1, project:DB.project||{}, records:DB.records||{},
          settings:DB.settings||{}, standards:DB.standards||[], memory:DB.memory||{}};
}
function syncHdrs(){
  return {'Content-Type':'application/json', 'Authorization':'Bearer ' + String(syncCfg().token||'').trim()};
}
function syncMsg(t, good){
  var el = document.getElementById('syncMsg');
  if(el){ el.textContent = t; el.className = 'note ' + (good ? 'ok' : 'warn'); }
  else toast(t);
}
function syncTest(){
  if(!syncReady()) return syncMsg('先填服务地址和口令，然后点“保存设置”', false);
  syncMsg('正在连接…', true);
  fetch(syncBase() + '/health').then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok) syncMsg('连接成功：' + (j.name||'sync') + '　服务时间 ' + (j.time||''), true);
    else syncMsg('连上了但返回异常：' + String(JSON.stringify(j)).slice(0,120), false);
  }).catch(function(e){
    syncMsg('连接失败：' + e.message + '　检查地址是否正确、是否 https、Worker 是否已部署', false);
  });
}
function syncPush(silent, force){
  if(!syncReady()){ if(!silent) syncMsg('还没配置云同步', false); return Promise.resolve(false); }
  var s = syncCfg();
  var payload = {data: syncPayload()};
  if(!force) payload.baseRev = s.rev || 0;
  return fetch(syncBase() + '/sync', {method:'PUT', headers: syncHdrs(), body: JSON.stringify(payload)})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(x){
      if(x.status === 200){
        s.rev = x.j.rev; s.ts = x.j.ts; s.lastPush = new Date().toISOString(); s.pending = null;
        saveDB();
        if(!silent) syncMsg('已上传：版本 ' + s.rev + '，' + (x.j.ts||''), true);
        return true;
      }
      if(x.status === 409){
        s.pending = {rev:x.j.rev, ts:x.j.ts || ''}; saveDB();
        if(silent) return false;
        var useCloud = confirm('云端有更新的版本 ' + x.j.rev + '（' + (x.j.ts||'') + '）。确定 = 用云端覆盖本地；取消 = 用本地覆盖云端。');
        return useCloud ? syncPull(false, true) : syncPush(false, true);
      }
      throw new Error('HTTP ' + x.status + ' ' + String(JSON.stringify(x.j)).slice(0,80));
    })
    .catch(function(e){
      if(!silent) syncMsg('上传失败：' + e.message, false);
      return false;
    });
}
function syncPull(silent, force){
  if(!syncReady()){ if(!silent) syncMsg('还没配置云同步', false); return Promise.resolve(false); }
  return fetch(syncBase() + '/sync', {headers:{'Authorization':'Bearer ' + String(syncCfg().token||'').trim()}})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(x){
      if(x.status !== 200) throw new Error('HTTP ' + x.status);
      if(!x.j.data){ if(!silent) syncMsg('云端还没有数据，先点“上传”一次', false); return false; }
      if(!force && !confirm('用云端数据（版本 ' + x.j.rev + '，' + (x.j.ts||'') + '）覆盖本机全部数据？本机现有记录会被替换，建议先导出备份。')) return false;
      var keep = syncCfg();
      var d = x.j.data;
      DB.project = d.project || {};
      DB.records = d.records || {};
      DB.settings = d.settings || {};
      if(d.standards && d.standards.length) DB.standards = d.standards;
      if(d.memory) DB.memory = d.memory;
      MODULES.forEach(function(m){ if(!DB.records[m.id]) DB.records[m.id] = []; });
      DB.sync = keep;
      DB.sync.rev = x.j.rev; DB.sync.ts = x.j.ts; DB.sync.lastPull = new Date().toISOString(); DB.sync.pending = null;
      saveDB(); render();
      if(!silent) syncMsg('已从云端恢复：版本 ' + x.j.rev, true);
      return true;
    })
    .catch(function(e){
      if(!silent) syncMsg('下载失败：' + e.message, false);
      return false;
    });
}
function syncAutoCheck(){
  if(!syncReady()) return;
  fetch(syncBase() + '/sync', {headers:{'Authorization':'Bearer ' + String(syncCfg().token||'').trim()}})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var s = syncCfg();
      if(j && typeof j.rev === 'number' && j.rev > (s.rev||0)){
        s.pending = {rev:j.rev, ts:j.ts || ''};
        saveDB(); render();
      }
    }).catch(function(){});
}

function exportAll(){
  DB.settings.lastBackup = today();
  DB.settings.lastExport = today();
  saveDB();
  var blob = new Blob(['\ufeff' + JSON.stringify(DB, null, 1)], {type:'application/json;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '施工办公台-备份-' + today() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 1500);
  toast('已导出备份文件，请发到微信保存');
  render();
}
function importAll(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(String(fr.result).replace(/^\ufeff/,''));
      if(!d.records && !d.project) throw new Error('格式不对');
      if(!confirm('导入将覆盖当前全部数据，确定继续？')) return;
      DB = d;
      MODULES.forEach(function(m){ if(!DB.records[m.id]) DB.records[m.id] = []; });
      DB.memory = DB.memory || {}; DB.memory.chips = DB.memory.chips || {}; DB.memory.recents = DB.memory.recents || {};
      if(!DB.standards) DB.standards = STANDARDS0.map(function(x){ return {code:x.code,name:x.name,use:x.use}; });
      saveDB(); schedulePush(); toast('导入成功'); go('home');
    }catch(e){ alert('导入失败：不是本工作台导出的备份文件'); }
  };
  fr.readAsText(f,'utf-8');
  input.value = '';
}
function clearAll(){
  if(!confirm('将删除本机上全部记录，不可恢复。确定吗？')) return;
  if(!confirm('再确认一次：真的清空？（建议先导出备份）')) return;
  DB.records = {}; MODULES.forEach(function(m){ DB.records[m.id] = []; });
  DB.project = {}; DB.settings = {}; DB.memory = {chips:{}, recents:{}};
  saveDB(); toast('已清空'); go('home');
}
